name: v5 Branch Validation

on:
  push:
    branches:
      - codex/v5-context-minimal-reform

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.7'
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - run: bash scripts/check.sh
      - run: git diff --check
