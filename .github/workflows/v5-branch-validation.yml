name: v5 Branch Validation

on:
  push:
    branches:
      - codex/v5-context-minimal-reform

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.7'
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - run: bash scripts/check.sh
      - run: git diff --check
      - name: Fresh v5 adopt smoke
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          PROJECT="$(mktemp -d)"
          git -C "$PROJECT" init --initial-branch=main -q

          python "$ROOT/skills/themasterplan/scripts/themasterplan.py" plan-adopt             --root "$PROJECT"             --source "$ROOT"             --commit "$CANDIDATE_SHA"             --profile git             --validation-path scripts/check.sh             --output "$PROJECT/adopt.json"

          python "$ROOT/skills/themasterplan/scripts/themasterplan.py" apply-adopt             --root "$PROJECT"             --plan "$PROJECT/adopt.json"             --source "$ROOT"             --commit "$CANDIDATE_SHA"

          python "$PROJECT/.themasterplan/bin/themasterplan.py" verify --root "$PROJECT"
          python "$PROJECT/.themasterplan/bin/themasterplan.py" doctor --root "$PROJECT"

          python - "$PROJECT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          state = json.loads((root / ".themasterplan/state.json").read_text())
          assert state["source"]["version"] == "v5.0.0"
          assert "adapter" not in state["selection"]
          assert not (root / "adapters/generic.md").exists()
          agents = (root / "AGENTS.md").read_text()
          assert "docs/client-update-flow.md" not in agents
          assert "docs/external-workflow-abstention.md" not in agents
          print("fresh v5 adopt smoke: PASS")
          PY
      - name: v4.1.0 old-executor to v5 smoke
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          V4_DIR="$(mktemp -d)"
          PROJECT="$(mktemp -d)"
          git -C "$PROJECT" init --initial-branch=main -q

          git worktree add --detach "$V4_DIR" v4.1.0 >/dev/null
          V4_SHA="$(git -C "$V4_DIR" rev-parse HEAD)"

          python "$V4_DIR/skills/themasterplan/scripts/themasterplan.py" plan-adopt             --root "$PROJECT"             --source "$V4_DIR"             --commit "$V4_SHA"             --profile git             --adapter generic             --validation-path scripts/check.sh             --output "$PROJECT/adopt-v4.json"

          python "$V4_DIR/skills/themasterplan/scripts/themasterplan.py" apply-adopt             --root "$PROJECT"             --plan "$PROJECT/adopt-v4.json"             --source "$V4_DIR"             --commit "$V4_SHA"

          python "$PROJECT/.themasterplan/bin/themasterplan.py" plan-update             --root "$PROJECT"             --source "$ROOT"             --commit "$CANDIDATE_SHA"             --output "$PROJECT/update-v5.json"

          python - "$PROJECT/update-v5.json" <<'PY'
          import json, pathlib, sys
          plan = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert not plan["stop_conditions"], plan["stop_conditions"]
          removed = {
              op["destination"]
              for op in plan["files"]
              if op["classification"] == "REMOVED_UPSTREAM"
          }
          assert "adapters/generic.md" in removed
          print("v4 old-executor plan-update: PASS")
          PY

          python "$PROJECT/.themasterplan/bin/themasterplan.py" apply-update             --root "$PROJECT"             --plan "$PROJECT/update-v5.json"             --source "$ROOT"             --commit "$CANDIDATE_SHA"

          python "$PROJECT/.themasterplan/bin/themasterplan.py" verify --root "$PROJECT"
          python "$PROJECT/.themasterplan/bin/themasterplan.py" doctor --root "$PROJECT"

          python - "$PROJECT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          state = json.loads((root / ".themasterplan/state.json").read_text())
          assert state["source"]["version"] == "v5.0.0"
          assert state["selection"].get("adapter") == "generic"
          assert not (root / "adapters/generic.md").exists()
          print("v4.1.0 -> v5 first apply: PASS (legacy adapter field tolerated)")
          PY

          # The installed executor is now v5. A subsequent v5 state write
          # normalizes the tolerated v4 no-op field away.
          python "$PROJECT/.themasterplan/bin/themasterplan.py" plan-update             --root "$PROJECT"             --source "$ROOT"             --commit "$CANDIDATE_SHA"             --output "$PROJECT/normalize-v5.json"

          python "$PROJECT/.themasterplan/bin/themasterplan.py" apply-update             --root "$PROJECT"             --plan "$PROJECT/normalize-v5.json"             --source "$ROOT"             --commit "$CANDIDATE_SHA"

          python - "$PROJECT" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          state = json.loads((root / ".themasterplan/state.json").read_text())
          assert "adapter" not in state["selection"]
          print("v5 state normalization: PASS")
          PY

          python "$PROJECT/.themasterplan/bin/themasterplan.py" verify --root "$PROJECT"
          python "$PROJECT/.themasterplan/bin/themasterplan.py" doctor --root "$PROJECT"
