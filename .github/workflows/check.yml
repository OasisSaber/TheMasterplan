name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # Required only for checkout; PR data comes from the event payload.

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 相对路径调用当前 PR 内的中央 reusable workflow，
  # 确保 TheMasterplan 的 PR 测试当前 PR 中的策略实现而不是远端旧版本。
  # 真实 check-run 名称：themasterplan-check / check（与消费者 smoke 仓库一致）。
  themasterplan-check:
    uses: ./.github/workflows/themasterplan-check.yml
  windows-regressions:
    name: Windows executor regressions
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.7'
      - name: Run path, State and update regressions
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p 'test_*regressions.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
